name: KraftDele Scraper & YML Generator

on:
  schedule:
    # Запускається щодня о 03:00 ночі (UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Дозволяє вручну запускати кнопкою з панелі GitHub

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout репозиторію
        uses: actions/checkout@v4
        
      - name: Налаштування Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Встановлення залежностей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Запуск парсеру та перекладача
        run: python main.py
        
      - name: Збереження XML як Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prom-feed
          path: prom_feed.xml
