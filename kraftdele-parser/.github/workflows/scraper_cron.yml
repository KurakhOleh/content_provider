name: Scraper Cron

on:
  schedule:
    - cron: '0 2 * * *' # Запуск кожного дня о 02:00
  workflow_dispatch: # Дозволяє запускати пайплайн вручну з інтерфейсу GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Parser Pipeline
      run: python main.py

    # TODO: Додати кроки для збереження, відправки по FTP, 
    # або створення коміту зі згенерованим XML файлом
